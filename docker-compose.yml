services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: geospatial_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
